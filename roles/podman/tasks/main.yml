---
# netavark (podman's default network backend) shells out to `nft` for firewall/NAT rules.
# RHEL-family hosts typically already have this via base OS defaults (firewalld); Debian
# doesn't ship it by default at all, so container networking silently fails without it.
- name: Install nftables (Debian)
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Install nftables (RHEL)
  become: true
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: nftables
    state: present

- name: Install podman
  become: true
  notify: Restart podman.socket
  ansible.builtin.package:
    name: podman

- name: Create podman socket drop-in directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: '0755'
    path: /etc/systemd/system/podman.socket.d

- name: Permit podman socket for wheel group
  become: true
  notify: Restart podman.socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.socket.d/override.conf
    mode: '0644'
    content: |
      [Socket]
      SocketGroup=wheel

- name: Add uids to /etc/subuid and /etc/subgid
  become: true
  ansible.builtin.lineinfile:
    create: true
    mode: '0644'
    path: /etc/{{ item }}
    line: "containers:1000000:4294836225"
  loop: [subuid, subgid]
