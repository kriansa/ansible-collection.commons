---
- name: Install stratis-cli
  become: true
  ansible.builtin.package:
    name: stratis-cli

- name: Install podman-volume-stratis
  become: true
  ansible.builtin.dnf:
    name: https://github.com/kriansa/podman-volume-stratis/releases/download/v{{ podman_volume_stratis_version }}/podman-volume-stratis_{{ podman_volume_stratis_version }}_linux_amd64.rpm
    disable_gpg_check: true
    state: present

- name: Ensure stratisd is running
  become: true
  ansible.builtin.systemd_service:
    name: stratisd.service
    state: started
    enabled: true

- name: Check if stratis pool exists
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && stratis pool list | grep -q {{ stratis_pool_name }}
  changed_when: false
  register: stratis_pool_check
  failed_when: false

- name: Create stratis pool for podman
  become: true
  when: stratis_pool_check.rc != 0
  changed_when: true
  ansible.builtin.command:
    cmd: stratis pool create {{ stratis_pool_name }} {{ stratis_pool_device }}

# Podman's image store lives on the pool rather than the root filesystem: images are the
# fastest-growing thing on these hosts, and a root filesystem that fills up takes the whole machine
# down, while the pool has room to spare. This store also holds podman's record of every container
# and volume, so moving it means moving that record along with it — it cannot be rebuilt from the
# quadlets alone, because the volume plugin refuses to create a volume whose filesystem already
# exists, leaving every app unable to start.
- name: Check if the container storage filesystem exists
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && stratis filesystem list {{ stratis_pool_name }} | grep -q container-storage
  changed_when: false
  register: stratis_storage_check
  failed_when: false

- name: Create stratis filesystem for the container storage
  become: true
  when: stratis_storage_check.rc != 0
  changed_when: true
  ansible.builtin.command:
    cmd: stratis filesystem create {{ stratis_pool_name }} container-storage

# `nofail` so a pool that is not ready cannot hang the boot. Nothing else waits for this mount by
# default, so every quadlet unit is made to wait for it below.
- name: Mount the container storage
  become: true
  register: stratis_storage_mount
  ansible.posix.mount:
    path: /var/lib/containers/storage
    src: /dev/stratis/{{ stratis_pool_name }}/container-storage
    fstype: xfs
    opts: defaults,x-systemd.requires=stratisd.service,nofail
    state: mounted

# A newly created filesystem carries no SELinux labels, and the confined container runtime can only
# use its store when it is labelled container_var_lib_t.
- name: Restore SELinux labels on the container storage
  become: true
  when: stratis_storage_mount.changed
  changed_when: true
  ansible.builtin.command:
    cmd: restorecon -R /var/lib/containers/storage

# After every reboot, podman's record of containers and volumes on this mount still describes the
# previous boot. The first podman command of each boot clears it, and leaves a marker in /run so
# that later commands skip the clearing. That marker is not tied to the record it vouches for. If a
# quadlet unit runs podman before this mount is in place, the clearing lands on whatever sits in the
# empty directory underneath, and the real record is never cleared. Podman then believes volumes are
# still mounted when they are not, and hands containers an empty directory instead of their data.
#
# Quadlet's .network and .volume units run podman as soon as the network is up, which can be well
# before stratisd has the pool ready. Quadlet reads a drop-in directory per unit type, so these make
# every quadlet unit on the host wait for the mount, whichever tool deployed it.
- name: Create the quadlet drop-in directories for each unit type
  become: true
  ansible.builtin.file:
    path: /etc/containers/systemd/{{ item }}.d
    state: directory
    mode: "0755"
  loop: [container, network, volume, pod, kube, image, build]

- name: Make every quadlet unit wait for the container storage
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/systemd/{{ item }}.d/10-container-storage.conf
    content: |
      [Unit]
      RequiresMountsFor=/var/lib/containers/storage
    mode: "0644"
  loop: [container, network, volume, pod, kube, image, build]
  notify: Regenerate the quadlet units

# Every podman volume on this host lives on the pool, so quadlet volumes default to the stratis
# plugin instead of each .volume file repeating it. The plugin has to be running before podman can
# create or mount one of its volumes, hence the ordering. Quadlet reads this file after the .volume
# itself, so a Driver= written in a .volume file is overridden here rather than respected: a volume
# that genuinely needs another driver has to override it from its own <name>.volume.d/ directory.
- name: Make every quadlet volume use the stratis plugin
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/systemd/volume.d/20-stratis.conf
    content: |
      [Unit]
      After=podman-volume-stratis.service
      Requires=podman-volume-stratis.service

      [Volume]
      Driver=stratis
    mode: "0644"
  notify: Regenerate the quadlet units

- name: Enable podman-volume-stratis
  become: true
  ansible.builtin.systemd_service:
    name: podman-volume-stratis.service
    state: started
    enabled: true
