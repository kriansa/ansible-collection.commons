---
# A quadlet_stack provider. Every provider is included on both hooks, so the whole body is guarded
# once here rather than task by task: one task missing its own `when` would run twice per deploy,
# the first time against the host as it was before anything was deployed.
#
# This runs on `after` and not `before` because the base Caddyfile only changes when the ingress app
# itself is deployed. Before that, the host still holds the previous one - which, on a run that is
# moving a vhost out of it and into a claim, still defines that vhost. Writing here then would put
# two definitions of the same site in front of Caddy.
- name: Caddy ingress provider
  when: quadlet_hook == 'after'
  block:
    - name: Check every claim names a domain and exactly one way to serve it
      ansible.builtin.assert:
        that:
          - item.claim.domain is defined
          - (['upstream', 'address', 'raw'] | select('in', item.claim) | list | length) == 1
        fail_msg: >-
          {{ item.app }}: a caddy_ingress claim needs `domain` and exactly one of `upstream`
          (a quadlet and port, as main:8080), `address` (a literal host:port, for an upstream
          with no container name) or `raw` (the inside of the site block, written out in full).
          Got: {{ item.claim }}
        quiet: true
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain | default('(no domain)') }}"

    # A raw claim is written out exactly as given, so the fields that shape a generated
    # reverse_proxy have nothing to act on. Accepting them would let a claim say
    # `tls_insecure: true` and have it mean nothing, with no sign of that anywhere.
    - name: Check every raw claim is text and nothing else
      ansible.builtin.assert:
        that:
          - item.claim.raw is string
          - (['scheme', 'tls_insecure', 'preserve_host', 'flush_interval', 'headers_up']
             | select('in', item.claim) | list) == []
        fail_msg: >-
          {{ item.app }}: the caddy_ingress claim for {{ item.claim.domain }} uses `raw`, which
          has to be a string and cannot be combined with scheme, tls_insecure, preserve_host,
          flush_interval or headers_up - write those into the raw block itself.
          Got: {{ item.claim }}
        quiet: true
      when: "'raw' in item.claim"
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # Rendered into the vhost, so a non-string value would reach Caddy as whatever Python's repr
    # of it looks like rather than failing.
    - name: Check every headers_up is a mapping of strings
      ansible.builtin.assert:
        that:
          - item.claim.headers_up is mapping
          - item.claim.headers_up.values() | reject('string') | list == []
        fail_msg: >-
          {{ item.app }}: `headers_up` on the caddy_ingress claim for {{ item.claim.domain }} must
          be a mapping of header name to a string value. Got: {{ item.claim.headers_up }}
        quiet: true
      when: "'headers_up' in item.claim"
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # A bare `forward_auth: sso` is the shape most people reach for first, and as a string it would
    # fail later on an attribute lookup rather than here, so it is named explicitly.
    - name: Check every forward_auth names a profile
      ansible.builtin.assert:
        that:
          - item.claim.forward_auth is mapping
          - item.claim.forward_auth.profile is defined
        fail_msg: >-
          {{ item.app }}: the caddy_ingress claim for {{ item.claim.domain }} has a `forward_auth`
          that is not a mapping naming a profile. Write it as `forward_auth: {profile: <name>}`,
          optionally with `require_roles: [<value>, ...]`. Got: {{ item.claim.forward_auth }}
        quiet: true
      when: "'forward_auth' in item.claim"
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # The profiles live in the playbook, not here, so a name that resolves to nothing usually means
    # a claim travelled to a host whose playbook does not define it.
    - name: Check every named auth profile exists
      ansible.builtin.assert:
        that: item.claim.forward_auth.profile in caddy_ingress_auth
        fail_msg: >-
          {{ item.app }}: the caddy_ingress claim for {{ item.claim.domain }} names the auth
          profile `{{ item.claim.forward_auth.profile }}`, which is not defined in
          caddy_ingress_auth. Defined on this host:
          {{ caddy_ingress_auth.keys() | list | join(', ') | default('(none)', true) }}
        quiet: true
      when: "'forward_auth' in item.claim"
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # Caught here rather than by `caddy validate` later, which would report a syntax error in
    # generated output instead of naming the profile that is incomplete.
    - name: Check every named auth profile is complete
      ansible.builtin.assert:
        that:
          - (['endpoint', 'uri', 'redirect', 'copy_headers']
             | reject('in', caddy_ingress_auth[item.claim.forward_auth.profile]) | list) == []
          - item.claim.forward_auth.require_roles is not defined
            or caddy_ingress_auth[item.claim.forward_auth.profile].role_header is defined
        fail_msg: >-
          {{ item.app }}: the auth profile `{{ item.claim.forward_auth.profile }}` needs `endpoint`,
          `uri`, `redirect` and `copy_headers`, plus `role_header` for a claim that sets
          `require_roles`. Got: {{ caddy_ingress_auth[item.claim.forward_auth.profile] }}
        quiet: true
      when: "'forward_auth' in item.claim"
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # Values are matched against the header verbatim, so they carry whatever prefix the upstream
    # uses - oauth2-proxy reports a Keycloak role as `role:<name>`. An empty list would render a
    # matcher that denies everyone.
    - name: Check every require_roles is a non-empty list of strings
      ansible.builtin.assert:
        that:
          - item.claim.forward_auth.require_roles is sequence
          - item.claim.forward_auth.require_roles is not string
          - item.claim.forward_auth.require_roles | length > 0
          - item.claim.forward_auth.require_roles | reject('string') | list == []
        fail_msg: >-
          {{ item.app }}: `require_roles` on the caddy_ingress claim for {{ item.claim.domain }}
          must be a non-empty list of strings, written as they appear in the
          {{ caddy_ingress_auth[item.claim.forward_auth.profile].role_header | default('role') }}
          header. Got: {{ item.claim.forward_auth.require_roles }}
        quiet: true
      when:
        - "'forward_auth' in item.claim"
        - item.claim.forward_auth.require_roles is defined
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # Both gates would be installed and the one in the raw block would decide, since it runs second
    # against a request the first already authenticated. Nothing about that is visible in the
    # claim, so it is refused instead.
    - name: Check no raw block gates itself as well
      ansible.builtin.assert:
        that: "'forward_auth' not in item.claim.raw"
        fail_msg: >-
          {{ item.app }}: the caddy_ingress claim for {{ item.claim.domain }} sets `forward_auth`
          and its `raw` block contains a forward_auth directive of its own. Keep one: either let
          the claim declare the gate, or write the whole gate into the raw block.
        quiet: true
      when:
        - "'forward_auth' in item.claim"
        - "'raw' in item.claim"
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # Done once, up front, so selecting per instance below is a plain comparison rather than the
    # same default repeated in every filter
    - name: Give every claim an explicit instance
      ansible.builtin.set_fact:
        caddy_ingress_claims: >-
          {{ caddy_ingress_claims | default([])
             + [item | combine({'claim': item.claim
                 | combine({'instance': item.claim.instance | default('main')})})] }}
      loop: "{{ quadlet_claims }}"
      loop_control:
        label: "{{ item.app }}: {{ item.claim.domain }}"

    # The instances are not configured anywhere: config_dir is keyed by quadlet, so its keys are
    # exactly the Caddys this app runs - {main, admin} on a host with a second one for a management
    # VLAN, {main} on a host with one.
    - name: Write and reload each Caddy
      ansible.builtin.include_tasks: instance.yml
      loop: "{{ quadlet_stack.apps[caddy_ingress_app].config_dir | dict2items }}"
      loop_control:
        loop_var: caddy_ingress_dir
        label: "{{ caddy_ingress_app }}--{{ caddy_ingress_dir.key }}"
